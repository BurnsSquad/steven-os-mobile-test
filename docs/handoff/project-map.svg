<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2260" viewBox="0 0 1280 2260" role="img" aria-labelledby="title desc"><title id="title">Burns Base project map and handoff</title><desc id="desc">Six completed project stages, present integration work, evidence limits, and the next steps. Updated October 17, 2026.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d34}.eyebrow{font-size:16px;letter-spacing:3px;font-weight:700}.headline{font-size:57px;font-weight:700;letter-spacing:-2px}.section{font-size:29px;font-weight:700}.body{font-size:21px}.small{font-size:17px}.badge{font-size:16px;font-weight:700}</style><rect width="1280" height="2260" fill="#f4f5ef"/><rect x="0" y="0" width="1280" height="14" fill="#285b45"/><text x="64" y="67" class="eyebrow">BURNS BASE / PROJECT HANDOFF</text><text x="64" y="143" class="headline">How we got here.</text><text x="64" y="209" class="headline">What happens next.</text><text x="64" y="258" class="small">Updated October 17, 2026 · Sandbox development · No production release</text><text x="64" y="329" class="section">THE WORK COMPLETED SO FAR</text><rect x="64" y="365" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="103" cy="405" r="21" fill="#e5ecdf"/><text x="89" y="411" class="badge">01</text><text x="138" y="411" class="badge">PROTECT THE ORIGINAL</text><text x="90" y="456" class="section">Existing Steven OS files preserved</text><text x="90" y="510" class="body">Stable v122 index kept unchanged. No personal</text><text x="90" y="538" class="body">records moved, erased or invented.</text><text x="90" y="616" class="small" style="fill:#567166">Verified file hash</text><rect x="652" y="365" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="691" cy="405" r="21" fill="#e5ecdf"/><text x="677" y="411" class="badge">02</text><text x="726" y="411" class="badge">BUILD AN ISOLATED SANDBOX</text><text x="678" y="456" class="section">A safe place to prove sharing</text><text x="678" y="510" class="body">Created fictional identities, private/shared test</text><text x="678" y="538" class="body">tables and household membership rules.</text><text x="678" y="616" class="small" style="fill:#567166">Isolated Supabase project</text><rect x="64" y="665" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="103" cy="705" r="21" fill="#e5ecdf"/><text x="89" y="711" class="badge">03</text><text x="138" y="711" class="badge">VERIFY THE ORIGINAL API</text><text x="90" y="756" class="section">Prove permissions with real requests</text><text x="90" y="810" class="body">27 UPDATE checks and 38 full-suite checks matched</text><text x="90" y="838" class="body">independent before/after snapshots. Approved</text><text x="90" y="866" class="body">cleanup preserved baselines.</text><text x="90" y="916" class="small" style="fill:#567166">Live API evidence</text><rect x="652" y="665" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="691" cy="705" r="21" fill="#e5ecdf"/><text x="677" y="711" class="badge">04</text><text x="726" y="711" class="badge">PROVE DEVICE SHARING</text><text x="678" y="756" class="section">One change visible in another session</text><text x="678" y="810" class="body">v132: Mac account A created a task; phone account</text><text x="678" y="838" class="body">B saw and completed it; A saw completion.</text><text x="678" y="866" class="body">Unrelated C stayed isolated.</text><text x="678" y="916" class="small" style="fill:#567166">Earlier live acceptance</text><rect x="64" y="965" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="103" cy="1005" r="21" fill="#e5ecdf"/><text x="89" y="1011" class="badge">05</text><text x="138" y="1011" class="badge">AGREE THE PLANNER RULES</text><text x="90" y="1056" class="section">Tasks for adults; Activities for</text><text x="90" y="1090" class="section">children</text><text x="90" y="1126" class="body">v133 demonstrated own Activities, sibling</text><text x="90" y="1154" class="body">visibility, eligible Tasks, completion once and</text><text x="90" y="1182" class="body">separate Shared contributions.</text><text x="90" y="1216" class="small" style="fill:#567166">Design walkthrough + UI checks</text><rect x="652" y="965" width="564" height="278" rx="20" fill="white" stroke="#d8e1d5"/><circle cx="691" cy="1005" r="21" fill="#e5ecdf"/><text x="677" y="1011" class="badge">06</text><text x="726" y="1011" class="badge">INSTALL THE NEW DATABASE</text><text x="678" y="1056" class="section">Server-enforced roles and completion</text><text x="678" y="1110" class="body">Six new secured tables, transactional functions,</text><text x="678" y="1138" class="body">assignments and attribution installed. Managed-</text><text x="678" y="1166" class="body">Auth compatibility fixed; old records unchanged.</text><text x="678" y="1216" class="small" style="fill:#567166">59 local checks + hosted SQL-role checks</text><rect x="64" y="1298" width="1152" height="236" rx="22" fill="#285b45"/><text x="94" y="1340" class="eyebrow" style="fill:#ffffff">YOU ARE HERE / WEBSITE INTEGRATION</text><text x="94" y="1388" class="section" style="fill:#ffffff">Database installed. Website integration implemented.</text><text x="94" y="1431" class="body" style="fill:#ffffff">v134 uses test-account sign-in and the new database functions.</text><text x="94" y="1463" class="body" style="fill:#ffffff">Verify the browser flow → run actual Mac + phone acceptance.</text><text x="94" y="1495" class="body" style="fill:#ffffff">The old role-switching demo is separate; it is not proof of live sign-in.</text><text x="64" y="1600" class="section">WHAT IS PROVEN — AND WHAT IS NOT</text><text x="64" y="1650" class="badge">VERIFIED</text><text x="300" y="1650" class="body">Old API permissions + earlier Mac/phone sharing.</text><text x="64" y="1693" class="badge">VERIFIED</text><text x="300" y="1693" class="body">New planner SQL rules; local concurrency and hosted role checks.</text><text x="64" y="1736" class="badge">STILL TO VERIFY</text><text x="300" y="1736" class="body">Actual JWT/PostgREST + new preview across devices.</text><text x="64" y="1779" class="badge">OPTIONAL</text><text x="300" y="1779" class="body">Leaked-password screening needs Pro; Free can support household use.</text><text x="64" y="1873" class="section">THE NEXT PERSON SHOULD START HERE</text><text x="64" y="1920" class="body">1  Read docs/handoff/README.md and the newest development-log entry.</text><text x="64" y="1958" class="body">2  Open the connected planner preview; use saved fictional account passwords.</text><text x="64" y="1996" class="body">3  Verify A/B/C rules and a change from Mac → phone → Mac.</text><text x="64" y="2034" class="body">4  Record evidence honestly; never substitute simulated tests for real sign-ins.</text><text x="64" y="2072" class="body">5  Before real household use: security plan, onboarding, release review.</text><line x1="64" y1="2150" x2="1216" y2="2150" stroke="#bccbbb"/><text x="64" y="2188" class="small">KEEP SAFE: stable index · existing private records · old policies · saved credentials</text><text x="64" y="2220" class="small">Draft review branch only. No merge, production promotion or unapproved cleanup.</text></svg>