<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"><rect x="0" y="0" width="800" height="1100" rx="0" fill="#F6F5ED"/><rect x="0" y="0" width="800" height="10" rx="0" fill="#235E51"/><text x="44" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#527169">BURNS BASE / YOUR FIRST ROUTINE</text><text x="44" y="112.0" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#173F39">Prepare for tomorrow.</text><text x="44" y="151.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#173F39">A starter checklist is now in your shared Tasks planner.</text><text x="44" y="1070.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#527169">OCT 17, 2026 • FIRST FAMILY TRIAL</text><text x="700" y="1070.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#527169">1 / 2</text><rect x="44" y="212" width="346" height="170" rx="18" fill="#DCEBE0"/><circle cx="73" cy="243" r="16" fill="#235E51"/><text x="64" y="247.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="100" y="248.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#173F39">Each child</text><text x="64" y="291.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">Pack what you need for tomorrow. Each</text><text x="64" y="311.3" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">child has their own Individual Task.</text><rect x="410" y="212" width="346" height="170" rx="18" fill="#DDE9F4"/><circle cx="439" cy="243" r="16" fill="#235E51"/><text x="430" y="247.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text><text x="466" y="248.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#173F39">Either parent</text><text x="430" y="291.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">Review tomorrow’s family plan. One parent</text><text x="430" y="311.3" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">can finish this Household Task once.</text><text x="44" y="434.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#527169">HOW TO TRY IT</text><circle cx="72" cy="485" r="23" fill="#235E51"/><text x="65" y="490.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text><text x="113" y="482.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#173F39">Open Tasks</text><text x="113" y="517.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#173F39">Sign in with your own username and refresh the list.</text><circle cx="72" cy="597" r="23" fill="#235E51"/><text x="65" y="602.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text><text x="113" y="594.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#173F39">Do your part</text><text x="113" y="629.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#173F39">Children complete their own packing Task. A parent completes the plan review.</text><circle cx="72" cy="709" r="23" fill="#235E51"/><text x="65" y="714.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text><text x="113" y="706.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#173F39">Check the family view</text><text x="113" y="741.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#173F39">Look for the completion and who recorded it on another device.</text><rect x="44" y="817" width="712" height="109" rx="18" fill="#E9BD66"/><text x="64" y="848.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#173F39">ONE SET, NOT AN AUTOMATIC DAILY SCHEDULE</text><text x="64" y="883.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#173F39">These Tasks do not reset or repeat by themselves. A later evening needs fresh Tasks.</text><text x="64" y="904.75" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#173F39">Completed history stays in place.</text><text x="44" y="974.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#173F39">After the first try: choose one useful improvement together.</text><text x="44" y="1011.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#527169">Your original dashboard and Finance records remain separate.</text></svg>