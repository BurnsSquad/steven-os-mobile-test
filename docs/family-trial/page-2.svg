<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"><rect x="0" y="0" width="800" height="1100" rx="0" fill="#F6F5ED"/><rect x="0" y="0" width="800" height="10" rx="0" fill="#235E51"/><text x="44" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#527169">BURNS BASE / PRIVATE FEEDBACK</text><text x="44" y="112.0" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#173F39">What made the day easier?</text><text x="44" y="151.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#173F39">Use the fillable PDF privately. Nothing on this sheet is submitted to the website.</text><text x="44" y="1070.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#527169">OCT 17, 2026 • FIRST FAMILY TRIAL</text><text x="700" y="1070.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#527169">2 / 2</text><text x="44" y="224.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#527169">A LIGHT FIRST-WEEK PLAN</text><rect x="44" y="248" width="228" height="114" rx="18" fill="#DCEBE0"/><text x="59" y="281.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">First evening</text><text x="59" y="313.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#173F39">Try one checklist set.</text><rect x="286" y="248" width="228" height="114" rx="18" fill="#DCEBE0"/><text x="301" y="281.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">Following days</text><text x="301" y="313.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#173F39">Notice friction; add fresh</text><text x="301" y="331.85" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#173F39">Tasks when needed.</text><rect x="528" y="248" width="228" height="114" rx="18" fill="#DCEBE0"/><text x="543" y="281.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">End of week</text><text x="543" y="313.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#173F39">Pick one change together.</text><text x="44" y="410.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">What helped?</text><rect x="44" y="428" width="712" height="83" rx="8" fill="#FFFFFF"/><text x="44" y="550.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">What was confusing or took too many taps?</text><rect x="44" y="568" width="712" height="83" rx="8" fill="#FFFFFF"/><text x="44" y="690.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#173F39">What should change next?</text><rect x="44" y="708" width="712" height="83" rx="8" fill="#FFFFFF"/><rect x="44" y="835" width="712" height="142" rx="18" fill="#DDE9F4"/><text x="64" y="866.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#527169">THE NEXT BUILDING DECISIONS</text><text x="64" y="900.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">1. Choose whether routines should repeat daily or on selected days.</text><text x="64" y="931.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#173F39">2. Map Finance’s existing calculations, storage, permissions and backups with its creator.</text><text x="44" y="1015.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#527169">Keep passwords, reset links and private family details out of public development notes.</text></svg>